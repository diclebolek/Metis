<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>denek</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel-2: #0e1624;
      --line: #243247;
      --text: #e8eef7;
      --muted: #8494ab;
      --accent: #4aa3f0;
      --accent-2: #1f6fad;
      --sys: #7d8fa5;
      --ok: #3ecf8e;
      --danger: #e35d6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 0% 0%, #17345a 0%, transparent 55%),
        radial-gradient(700px 400px at 100% 100%, #123528 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .shell {
      width: min(980px, 100%);
      height: min(720px, 92vh);
      display: grid;
      grid-template-columns: 220px 1fr;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.4);
    }
    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; height: auto; min-height: 85vh; }
      .sidebar { display: none; }
      .sidebar.open { display: flex; }
    }
    .sidebar {
      background: var(--panel-2);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: .9rem;
      gap: .85rem;
    }
    .brand {
      font-weight: 700;
      letter-spacing: .04em;
      font-size: 1rem;
    }
    .brand span { color: var(--accent); }
    .side-block h3 {
      margin: 0 0 .45rem;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 600;
    }
    .list { display: flex; flex-direction: column; gap: .3rem; }
    .list button, .chip {
      text-align: left;
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: .45rem .55rem;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }
    .list button:hover { background: #182338; }
    .list button.active {
      background: #17324d;
      border-color: #2a567a;
    }
    .chip {
      cursor: default;
      color: var(--muted);
      font-size: .88rem;
    }
    .chip::before {
      content: "";
      display: inline-block;
      width: .45rem;
      height: .45rem;
      margin-right: .4rem;
      border-radius: 50%;
      background: var(--ok);
    }
    .main { display: flex; flex-direction: column; min-width: 0; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      padding: .85rem 1rem;
      border-bottom: 1px solid var(--line);
    }
    #status {
      font-size: .8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    #status::before {
      content: "";
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: var(--danger);
    }
    #status.on::before { background: var(--ok); }
    .join, .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .join { display: grid; place-items: center; padding: 1.5rem; }
    .join-card {
      width: min(380px, 100%);
      display: grid;
      gap: .65rem;
    }
    .join-card p { margin: 0 0 .3rem; color: var(--muted); font-size: .9rem; }
    input, button.primary, button.ghost {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: .65rem .8rem;
      background: #0f1724;
      color: var(--text);
    }
    input:focus { outline: 2px solid #245988; border-color: var(--accent); }
    button.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }
    .msg {
      max-width: 78%;
      padding: .55rem .75rem;
      border-radius: 12px;
      background: #101927;
      border: 1px solid var(--line);
      align-self: flex-start;
      word-break: break-word;
    }
    .msg.me {
      align-self: flex-end;
      background: #15324d;
      border-color: #2a567a;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      border: none;
      color: var(--sys);
      font-size: .84rem;
      padding: .15rem;
    }
    .msg .meta {
      font-size: .7rem;
      color: var(--muted);
      margin-bottom: .18rem;
    }
    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .5rem;
      padding: .85rem 1rem;
      border-top: 1px solid var(--line);
    }
    #typing {
      min-height: 1.1rem;
      padding: 0 1rem;
      font-size: .78rem;
      color: var(--muted);
    }
    .hidden { display: none !important; }
    .new-room {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .35rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">denek <span>chat</span></div>
      <div class="side-block">
        <h3>Rooms</h3>
        <div class="list" id="rooms"></div>
        <div class="new-room" style="margin-top:.5rem">
          <input id="newRoom" placeholder="new room" maxlength="32" />
          <button class="ghost" id="addRoom" type="button">+</button>
        </div>
      </div>
      <div class="side-block" style="flex:1; overflow:auto">
        <h3>Online</h3>
        <div class="list" id="online"></div>
      </div>
    </aside>

    <section class="main">
      <header>
        <strong id="roomTitle">Join a room</strong>
        <div id="status">disconnected</div>
      </header>

      <div class="join" id="join">
        <div class="join-card">
          <p>Real-time chat powered by Go, Rust, and Redis.</p>
          <input id="user" placeholder="username" maxlength="32" />
          <input id="room" placeholder="room" value="general" maxlength="32" />
          <button class="primary" id="connectBtn" type="button">Connect</button>
        </div>
      </div>

      <div class="chat hidden" id="chat">
        <div id="messages"></div>
        <div id="typing"></div>
        <form class="composer" id="form">
          <input id="text" placeholder="Write a message…" autocomplete="off" maxlength="1000" />
          <button class="primary" type="submit">Send</button>
        </form>
      </div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws = null;
    let me = "";
    let currentRoom = "";
    let typingTimer = null;
    let typingClear = null;
    const typingUsers = new Set();

    function setStatus(on, text) {
      $("status").textContent = text;
      $("status").classList.toggle("on", on);
    }

    function renderOnline(list) {
      const el = $("online");
      el.innerHTML = "";
      (list || []).forEach((name) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = name;
        el.appendChild(chip);
      });
      if (!list || !list.length) {
        const empty = document.createElement("div");
        empty.className = "chip";
        empty.style.opacity = ".6";
        empty.textContent = "nobody here";
        empty.style.setProperty("--ok", "#555");
        el.appendChild(empty);
      }
    }

    async function loadRooms(active) {
      try {
        const res = await fetch("/api/rooms");
        const rooms = await res.json();
        const el = $("rooms");
        el.innerHTML = "";
        rooms.sort((a, b) => a.name.localeCompare(b.name));
        rooms.forEach((r) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = r.name + (r.online_count ? ` (${r.online_count})` : "");
          if (r.name === active) btn.classList.add("active");
          btn.onclick = () => switchRoom(r.name);
          el.appendChild(btn);
        });
      } catch (_) {}
    }

    function addMsg(m) {
      if (m.type === "typing") {
        if (m.user === me) return;
        typingUsers.add(m.user);
        updateTyping();
        clearTimeout(typingClear);
        typingClear = setTimeout(() => {
          typingUsers.delete(m.user);
          updateTyping();
        }, 1500);
        return;
      }
      if (m.type === "presence") {
        renderOnline(m.online || []);
        loadRooms(currentRoom);
        return;
      }

      const el = document.createElement("div");
      el.className = "msg" + (m.type === "system" ? " system" : m.user === me ? " me" : "");
      if (m.type === "system") {
        el.textContent = m.content;
      } else {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${m.user} · ${new Date(m.ts).toLocaleTimeString()}`;
        const body = document.createElement("div");
        body.textContent = m.content;
        el.append(meta, body);
      }
      $("messages").appendChild(el);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function updateTyping() {
      const names = [...typingUsers];
      $("typing").textContent = names.length
        ? names.join(", ") + (names.length === 1 ? " is typing…" : " are typing…")
        : "";
    }

    async function loadHistory(room) {
      $("messages").innerHTML = "";
      try {
        const res = await fetch("/api/rooms/" + encodeURIComponent(room) + "/messages");
        const list = await res.json();
        list.forEach(addMsg);
      } catch (_) {}
    }

    async function loadPresence(room) {
      try {
        const res = await fetch("/api/rooms/" + encodeURIComponent(room) + "/presence");
        const data = await res.json();
        renderOnline(data.online || []);
      } catch (_) {}
    }

    function connect(room) {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      currentRoom = room;
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws?user=${encodeURIComponent(me)}&room=${encodeURIComponent(room)}`);

      ws.onopen = async () => {
        setStatus(true, `${me} @ ${room}`);
        $("roomTitle").textContent = "#" + room;
        $("join").classList.add("hidden");
        $("chat").classList.remove("hidden");
        await loadHistory(room);
        await loadPresence(room);
        await loadRooms(room);
        $("text").focus();
      };
      ws.onmessage = (ev) => {
        try { addMsg(JSON.parse(ev.data)); } catch (_) {}
      };
      ws.onclose = () => setStatus(false, "disconnected");
    }

    async function switchRoom(room) {
      if (!me || room === currentRoom) return;
      await fetch("/api/rooms", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: room }),
      });
      typingUsers.clear();
      updateTyping();
      connect(room);
    }

    $("connectBtn").onclick = async () => {
      me = $("user").value.trim();
      const room = ($("room").value.trim().toLowerCase() || "general");
      if (!me) { $("user").focus(); return; }
      await fetch("/api/rooms", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: room }),
      });
      connect(room);
    };

    $("addRoom").onclick = async () => {
      const name = $("newRoom").value.trim().toLowerCase();
      if (!name) return;
      await fetch("/api/rooms", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      $("newRoom").value = "";
      if (me) switchRoom(name);
      else {
        $("room").value = name;
        await loadRooms(name);
      }
    };

    $("form").onsubmit = (e) => {
      e.preventDefault();
      const content = $("text").value.trim();
      if (!content || !ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify({ content, type: "chat" }));
      $("text").value = "";
    };

    $("text").addEventListener("input", () => {
      if (!ws || ws.readyState !== 1) return;
      if (typingTimer) return;
      ws.send(JSON.stringify({ type: "typing" }));
      typingTimer = setTimeout(() => { typingTimer = null; }, 1200);
    });

    loadRooms("general");
  </script>
</body>
</html>
