<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metis</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f1419" />
</head>
<body class="theme-dark">
  <div class="shell">
    <aside class="sidebar">
      <div class="side-top">
        <div class="brand">Metis</div>
        <div class="user-card" id="meCard" title="Profil ve ayarlar" role="button" tabindex="0">
          <div class="avatar" id="avatar">?</div>
          <div class="user-meta">
            <strong id="meLabel">giriş yok</strong>
            <small id="meHint">oturum aç</small>
          </div>
          <button class="logout-link" id="logoutBtn" type="button" title="Çıkış">çıkış</button>
        </div>
      </div>

      <div class="side-scroll">
        <section class="nav-section tone-rooms">
          <div class="nav-head">
            <h3>Odalar</h3>
            <button class="icon-btn" id="toggleRoomCreate" type="button" title="Yeni oda">+</button>
          </div>
          <div class="create-panel hidden" id="roomCreate">
            <label>Yeni oda adı</label>
            <div class="actions">
              <input id="newRoom" placeholder="ör. proje" maxlength="32" />
            </div>
            <label class="ttl-label">Süre</label>
            <select id="roomTTL">
              <option value="">Kalıcı</option>
              <option value="2h">Süreli · 2 saat</option>
              <option value="midnight">Süreli · gece yarısı</option>
              <option value="24h">Süreli · 24 saat</option>
            </select>
            <label class="ttl-label">Tür</label>
            <select id="roomKind">
              <option value="room">Normal oda</option>
              <option value="timed">Toplantı (süreli)</option>
              <option value="event">Etkinlik (süreli)</option>
            </select>
            <div class="actions">
              <button class="btn-sm primary" id="addRoom" type="button">Ekle</button>
              <button class="btn-sm ghost" id="cancelRoomCreate" type="button">İptal</button>
            </div>
          </div>
          <div class="nav-list" id="rooms"></div>
        </section>

        <section class="nav-section tone-dms">
          <div class="nav-head"><h3>Özel mesajlar</h3></div>
          <div class="nav-list" id="dms"></div>
        </section>

        <section class="nav-section tone-people">
          <div class="nav-head"><h3>Kişiler</h3></div>
          <input class="people-search" id="peopleSearch" type="search" placeholder="kişi ara…" autocomplete="off" />
          <div class="nav-list" id="people"></div>
        </section>
        <section class="nav-section tone-tools">
          <div class="nav-head"><h3>Araçlar</h3></div>
          <div class="tool-row">
            <input class="people-search" id="globalSearch" type="search" placeholder="Tüm odalarda ara…" />
          </div>
          <div class="nav-list search-hits" id="searchHits"></div>
          <div class="tool-row focus-row">
            <label>Odak</label>
            <select id="myFocus">
              <option value="here">bu odada</option>
              <option value="busy">meşgul</option>
              <option value="away">uzakta</option>
            </select>
          </div>
          <div class="tool-row">
            <button class="btn-sm ghost" id="themeToggle" type="button">Tema: koyu</button>
            <button class="btn-sm ghost" id="inviteBtn" type="button">Davet linki</button>
          </div>
        </section>
      </div>
    </aside>

    <section class="main">
      <div class="auth" id="auth">
        <div class="auth-stage">
          <div class="auth-glow" aria-hidden="true"></div>
          <div class="auth-card anim-rise">
            <div class="auth-brand">
              <div class="auth-mark">M</div>
              <div>
                <h1>Metis</h1>
                <p class="auth-tag">gerçek zamanlı sohbet · go · rust · redis</p>
              </div>
            </div>
            <div class="tabs">
              <button class="ghost active-tab" id="tabLogin" type="button">Giriş</button>
              <button class="ghost" id="tabRegister" type="button">Kayıt</button>
            </div>
            <label class="field">
              <span>Kullanıcı adı</span>
              <input id="username" placeholder="ör. alice" maxlength="24" autocomplete="username" />
            </label>
            <label class="field">
              <span>Şifre</span>
              <input id="password" type="password" placeholder="••••••••" maxlength="72" autocomplete="current-password" />
            </label>
            <button class="primary auth-submit" id="authBtn" type="button">Giriş yap</button>
            <div class="err" id="authErr"></div>
            <p class="hint">Demo: <button type="button" class="demo-chip" data-u="alice">alice</button> / demo123</p>
          </div>
        </div>
      </div>

      <div class="workspace hidden" id="workspace">
        <div class="panels" id="panels">
          <section class="panel" id="panelMain" data-slot="main"></section>
          <section class="panel panel-side hidden" id="panelSide" data-slot="side"></section>
        </div>
      </div>
    </section>
  </div>

  <div class="popover hidden" id="emojiPop"></div>
  <div class="popover gif-pop hidden" id="gifPop"></div>

  <div class="modal-backdrop hidden" id="profileModal">
    <div class="profile-card anim-rise" role="dialog" aria-modal="true">
      <button class="profile-close" id="profileClose" type="button" aria-label="Kapat">✕</button>
      <div class="profile-head">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div>
          <h2 id="profileName">user</h2>
          <p class="profile-sub" id="profileSub">profil</p>
        </div>
      </div>
      <div class="profile-actions" id="profileTopActions">
        <button class="primary" id="profileDm" type="button">Mesaj yaz</button>
        <button class="ghost" id="profileMute" type="button">Bildirimleri sessize al</button>
        <button class="ghost danger-outline" id="profileBlock" type="button">Engelle</button>
      </div>
      <div class="profile-tabs" id="profileTabs">
        <button type="button" class="tab-btn active" data-tab="media">Medya</button>
        <button type="button" class="tab-btn" data-tab="links">Bağlantılar</button>
        <button type="button" class="tab-btn hidden" data-tab="settings" id="tabSettingsBtn">Ayarlar</button>
      </div>
      <div class="profile-tab-panel" id="tabMedia">
        <div class="media-grid" id="profileMedia"></div>
      </div>
      <div class="profile-tab-panel hidden" id="tabLinks">
        <div class="links-list" id="profileLinks"></div>
      </div>
      <div class="profile-tab-panel hidden" id="tabSettings">
        <div class="settings-list">
          <div class="settings-row">
            <span>Tema</span>
            <div class="theme-switch" role="group" aria-label="Tema">
              <button type="button" class="theme-opt" data-theme="dark" id="themeOptDark">Koyu</button>
              <button type="button" class="theme-opt" data-theme="light" id="themeOptLight">Açık</button>
            </div>
          </div>
          <label class="settings-row">
            <span>Odak durumu</span>
            <select id="settingsFocus">
              <option value="here">Bu odada</option>
              <option value="busy">Meşgul</option>
              <option value="away">Uzakta</option>
            </select>
          </label>
          <label class="settings-row check">
            <span>Sesli bildirim</span>
            <input type="checkbox" id="settingsSound" />
          </label>
          <button type="button" class="ghost full" id="settingsNotify">Masaüstü bildirimi iste</button>
          <button type="button" class="ghost full danger-outline" id="settingsLogout">Çıkış yap</button>
        </div>
      </div>
    </div>
  </div>

  <template id="panelTpl">
    <header class="chat-header">
      <div class="header-left">
        <button type="button" class="room-title title-btn" title="Sohbet bilgisi">Sohbet</button>
        <span class="conn-status">bağlı değil</span>
      </div>
      <div class="header-right">
        <div class="online-pills"></div>
        <div class="header-search">
          <button class="tool-btn search-toggle" type="button" title="Ara" aria-label="Ara" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/>
              <path d="M16.5 16.5 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="search-pop hidden">
            <input class="msg-search" type="search" placeholder="Bu sohbette ara…" />
          </div>
        </div>
        <button class="tool-btn call-btn" type="button" title="Sesli ara">📞</button>
        <button class="tool-btn mute-btn" type="button" title="Ses">🔔</button>
        <button class="tool-btn close-side hidden" type="button" title="Paneli kapat">✕</button>
      </div>
    </header>
    <div class="pin-bar hidden"></div>
    <div class="messages"></div>
    <div class="typing"></div>
    <div class="reply-bar hidden">
      <div class="reply-preview"></div>
      <button type="button" class="reply-clear" title="Alıntıyı kaldır">✕</button>
    </div>
    <div class="rate-hint hidden"></div>
    <form class="composer">
      <input type="file" class="file-input hidden" accept="image/*,.png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.zip" multiple />
      <div class="tools-wrap">
        <button class="tool tools-toggle" type="button" title="Araçlar" aria-label="Araçlar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="tools-bubble hidden" role="menu">
          <button type="button" data-act="emoji" role="menuitem"><span>😀</span> Emoji</button>
          <button type="button" data-act="sticker" role="menuitem"><span>✨</span> Sticker</button>
          <button type="button" data-act="gif" role="menuitem"><span>GIF</span> GIF</button>
          <button type="button" data-act="photo" role="menuitem"><span>🖼️</span> Fotoğraf</button>
          <div class="tools-ephemeral">
            <label>Kaybolan mesaj</label>
            <select class="ephemeral-sel" title="Kaybolan mesaj">
              <option value="">kalıcı</option>
              <option value="after_read">okununca sil</option>
              <option value="24h">24s sonra sil</option>
            </select>
          </div>
        </div>
      </div>
      <input class="text" placeholder="Mesaj yaz…" autocomplete="off" maxlength="2000" />
      <button class="send-btn" type="submit" title="Gönder" aria-label="Gönder">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 16.5c0-5.2 3.1-9 7-9s7 3.8 7 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8.8 9.2 12 5.5l3.2 3.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </template>

  <div class="popover sticker-pop hidden" id="stickerPop"></div>
  <div class="toast-host" id="toastHost"></div>

  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
